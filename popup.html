<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AEGIS Invites for Facebook</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <img class="mark" src="icons/icon48.png" width="48" height="48" alt="">
      <div class="titles">
        <h1>AEGIS Invites for Facebook</h1>
        <p class="browsers">Chrome, Edge, Brave, Opera, Safari, Firefox</p>
      </div>
    </header>
    <main>
      <div class="stat-card">
        <div class="stat-value" id="today-count">0</div>
        <div class="stat-label">Invites today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-count">0</div>
        <div class="stat-label">Total invites</div>
      </div>
      <button id="open-options" class="btn-primary" type="button">Settings</button>
      <button id="open-fb" class="btn-secondary" type="button">Go to Facebook</button>
    </main>
    <footer>
      <span class="credit">by Gambit Mutant</span>
      <a class="gh" href="https://github.com/GambitMutant" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <img src="icons/github.svg" width="18" height="18" alt="">
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
